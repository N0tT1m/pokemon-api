networks:
  pokedex_net:
    name: pokedex_net

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokedex
      POSTGRES_PASSWORD: pokedex
      POSTGRES_DB: pokedex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pokedex_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokedex"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "158:158"
    environment:
      DATABASE_URI: postgresql://pokedex:pokedex@db:5432/pokedex
      PORT: "158"
      TLS_CERT: /app/certs/fullchain.pem
      TLS_KEY: /app/certs/privkey.pem
    volumes:
      - ./certs:/app/certs:ro
    networks:
      - pokedex_net
    depends_on:
      db:
        condition: service_healthy

  crawler:
    build:
      context: ./pokemondb_scraper
    environment:
      DATABASE_URI: postgresql://pokedex:pokedex@db:5432/pokedex
    networks:
      - pokedex_net
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - crawl

volumes:
  pgdata:
