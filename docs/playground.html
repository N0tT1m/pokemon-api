<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Pokemon API — Playground</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; padding: 0; font-family: Roboto, sans-serif; }
      .topnav {
        background: #1b1b1b;
        padding: 10px 24px;
        font-family: Montserrat, sans-serif;
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid #2a2a2a;
      }
      .topnav a {
        color: #fff;
        margin-right: 20px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 400;
      }
      .topnav a.active { color: #0e74c8; font-weight: 700; }
      .topnav a:hover { color: #0e74c8; }
      .swagger-ui .topbar { display: none; }
      .swagger-ui .info { margin: 24px 0; }
    </style>
  </head>
  <body>
    <nav class="topnav">
      <a href="/docs">Reference</a>
      <a href="/playground" class="active">Playground</a>
    </nav>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: '/openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        tryItOutEnabled: true,
        persistAuthorization: true,
        displayRequestDuration: true,
        filter: true,
        defaultModelsExpandDepth: 0,
        docExpansion: 'list',
      });
    </script>
  </body>
</html>
